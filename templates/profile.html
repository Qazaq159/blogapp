{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3">
            <div class="profile-sidebar card shadow-sm bg-light">
                <div class="profile-userpic text-center">
                    <div class="avatar-container rounded-circle mb-3" style="width: 150px; height: 150px; overflow: hidden; display: inline-block;">
                        <img src="{{ user.profile.avatar.url }}" class="profile-avatar" alt="Аватар" style="object-fit: cover; width: 150px; height: 150px;">
                    </div>
                </div>

                <div class="profile-usertitle text-center">
                    <h3 class="profile-username">{{ user.username }}</h3>
                    <p class="profile-location text-muted">{{ user.profile.location }}</p>
                </div>

                <div class="profile-usermenu mt-4">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a href="#" class="nav-link">
                                <i class="fas fa-file-alt"></i> Жазбаларым
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link">
                                <i class="fas fa-shield-alt"></i> Қауіпсіздік параметрлері
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Profile Settings -->
        <div class="col-md-9">
            <div class="card shadow-sm bg-white p-4">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
                
                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <!-- Avatar Upload -->
                        <div class="form-group mb-3">
                            <label for="avatar">Суретті таңдау</label>
                            <input type="file" id="avatar" name="avatar" class="form-control" accept="image/*">
                        </div>

                        <div class="form-group mb-3">
                            <label for="username">Пайдаланушы аты</label>
                            <input type="text" id="username" name="username" class="form-control" value="{{ user.username }}">
                        </div>

                        <div class="form-group mb-3">
                            <label for="first_name">Аты</label>
                            <input type="text" id="first_name" name="first_name" class="form-control" value="{{ user.first_name }}">
                        </div>

                        <div class="form-group mb-3">
                            <label for="last_name">Тегі</label>
                            <input type="text" id="last_name" name="last_name" class="form-control" value="{{ user.last_name }}">
                        </div>

                        <div class="form-group mb-3">
                            <label for="location">Орналасқан жері</label>
                            <input type="text" id="location" name="location" class="form-control" value="{{ user.profile.location }}">
                        </div>

                        <div class="form-group mb-3">
                            <label for="birthdate">Туған күні</label>
                            <input type="date" id="birthdate" name="birthdate" class="form-control" value="{{ user.profile.birthdate|date:'Y-m-d' }}">
                        </div>

                        <div class="form-group mb-3">
                            <label for="biography">Биография</label>
                            <textarea id="biography" name="biography" class="form-control" rows="3">{{ user.profile.biography }}</textarea>
                        </div>

                        <button type="submit" class="btn btn-primary mt-4">
                            <i class="fas fa-sync-alt"></i> Жаңарту
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
